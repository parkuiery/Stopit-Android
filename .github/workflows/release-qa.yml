name: Android Release QA

on:
  pull_request:
    branches: [main]
    # Include edited so develop -> main retargets materialize release gates without a new commit.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-release-qa:
    name: Full release QA
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate manual release QA ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          allowed=false
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            case "$GITHUB_REF_NAME" in
              "main"|release/*|hotfix/*) allowed=true ;;
            esac
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              allowed=true
            fi
          fi
          if [ "$allowed" != "true" ]; then
            echo "Android Release QA manual dispatch is allowed only from main, release/*, hotfix/*, or SemVer tag refs. This run will not restore Firebase secrets or run release QA."
            exit 1
          fi

      - name: Restore Firebase google-services.json files
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_DEV" || { echo 'GOOGLE_SERVICES_JSON_DEV secret is missing'; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON" || { echo 'GOOGLE_SERVICES_JSON secret is missing'; exit 1; }
          mkdir -p app/src/dev app/src/prod
          printf '%s' "$GOOGLE_SERVICES_JSON_DEV" > app/src/dev/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/src/prod/google-services.json

      - name: Run static policy unit tests
        run: |
          set -o pipefail
          mkdir -p release-qa-diagnostics
          python3 -m unittest scripts.tests.test_compose_compiler_gradle_contract scripts.tests.test_kds_dependency_catalog_contract scripts.tests.test_sensitive_logging_policy scripts.tests.test_android_manifest_contract scripts.tests.test_compose_icon_button_accessibility scripts.tests.test_locale_string_parity scripts.tests.test_locale_string_quality_contract scripts.tests.test_flavor_application_id_contract scripts.tests.test_android_runtime_suites_manifest scripts.tests.test_verify_lint_registry scripts.tests.test_lint_registry_workflows scripts.tests.test_test_source_lint_policy 2>&1 | tee release-qa-diagnostics/static-policy-unit-tests.log

      - name: Run full release JVM and build QA
        run: |
          set -euo pipefail
          ./gradlew \
            :app:testDevDebugUnitTest \
            :app:testProdReleaseUnitTest \
            :app:lintProdRelease \
            :app:assembleProdDebug

      - name: Verify Navigation/Compose lint registry coverage
        run: >-
          python3 scripts/verify_lint_registry.py
          --report app/build/reports/lint-results-prodRelease.html
          --require-section "Included Additional Checks"
          --require-identifier androidx.navigation.common
          --require-identifier androidx.navigation.compose
          --require-identifier androidx.navigation.runtime
          --require-issue-id MissingSerializableAnnotation
          --require-issue-id MissingKeepAnnotation
          --require-issue-id WrongNavigateRouteType
          --forbid-text "Requires newer lint; these checks will be skipped!"
          --forbid-text ObsoleteLintCustomCheck

      - name: Upload full release QA diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: stopit-release-qa-build-diagnostics
          path: |
            release-qa-diagnostics/**
            app/build/reports/**
            app/build/reports/problems/**
            app/build/test-results/**
            app/build/outputs/logs/**
            app/build/outputs/mapping/prodRelease/**
          if-no-files-found: ignore
          retention-days: 7

  # The release runtime suites run on a developer machine via
  # `scripts/runtime-gate.sh --sequence release`, which records
  # .runtime-evidence.json keyed by a digest of the runtime sources. No emulator
  # runs in CI any more; this job verifies that the release sequence -- not the
  # narrower android-ci one -- was the sequence that actually passed.
  release-runtime-evidence:
    name: Release runtime evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release runtime gate evidence
        run: >-
          python3 scripts/android_runtime_suites.py check-evidence
          --require-sequence release
