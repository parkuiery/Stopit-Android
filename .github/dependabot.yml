version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 3
    groups:
      android-gradle-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "com.google.dagger.hilt.android"
        # #925: Hilt 2.59+ requires AGP 9. Keep Stopit on the AGP 8.x
        # toolchain until a dedicated Android stack/toolchain lane upgrades AGP,
        # Gradle, Kotlin, KSP, Compose, and Hilt together.
        versions:
          - "[2.59,)"
      - dependency-name: "com.google.dagger:hilt-android"
        # Same AGP 9 boundary as the Hilt Gradle plugin above. Do not let the
        # broad android-gradle-patch-minor group recreate #914's known-incompatible
        # Hilt 2.59.x + AGP 8.x Gradle configuration failure.
        versions:
          - "[2.59,)"
      - dependency-name: "com.google.dagger:hilt-compiler"
        # Keep Hilt runtime/compiler/plugin aligned; release together from a
        # dedicated toolchain PR after AGP 9 readiness is explicit.
        versions:
          - "[2.59,)"
      - dependency-name: "org.jetbrains.kotlin.android"
        # #984: Kotlin 2.3.21 already makes legacy kotlinOptions.jvmTarget a
        # Gradle configuration error. Hold Kotlin 2.3+ until app/core:kds
        # migrate to compilerOptions in a dedicated Kotlin/toolchain lane.
        versions:
          - "[2.3,)"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        # Keep Kotlin Android and Compose compiler plugin aligned; do not let the
        # broad android-gradle-patch-minor group auto-land the Kotlin 2.3 DSL break.
        versions:
          - "[2.3,)"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        # Serialization plugin follows the Kotlin toolchain lane and should not
        # outrun the build-script compilerOptions migration.
        versions:
          - "[2.3,)"
      - dependency-name: "org.jetbrains.kotlin.jvm"
        # #939/#984: the standalone Kotlin JVM plugin shares the same Kotlin 2.3+
        # compilerOptions DSL migration boundary as Android/Compose/serialization.
        # Keep it out of the broad android-gradle-patch-minor group until the
        # dedicated Kotlin/toolchain lane removes legacy kotlinOptions.jvmTarget.
        versions:
          - "[2.3,)"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "r0adkll/upload-google-play"
        # Release-critical Play upload provenance boundary. Refresh only through
        # a reviewed release-governance PR that updates workflow, contract test,
        # and operator docs together.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      functions-npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "bun"
    directory: "/tools/aso-screenshots"
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      aso-screenshots-bun-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
