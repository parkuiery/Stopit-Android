version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      android-gradle-firebase-google-patch-minor:
        patterns:
          - "com.google.firebase:*"
          - "com.google.gms:google-services"
          - "com.google.firebase.crashlytics"
          - "com.google.android.gms:play-services-ads"
          - "com.google.android.play:*"
          - "com.android.installreferrer:*"
        update-types:
          - "minor"
          - "patch"
      android-gradle-androidx-ui-runtime-patch-minor:
        patterns:
          - "androidx.core:*"
          - "androidx.lifecycle:*"
          - "androidx.activity:*"
          - "androidx.compose:*"
          - "androidx.navigation:*"
          - "androidx.appcompat:*"
          - "androidx.datastore:*"
          - "androidx.hilt:*"
        update-types:
          - "minor"
          - "patch"
      android-gradle-room-ksp-patch-minor:
        patterns:
          - "androidx.room:*"
          - "androidx.room"
          - "com.google.devtools.ksp"
        update-types:
          - "minor"
          - "patch"
      android-gradle-test-tooling-patch-minor:
        patterns:
          - "junit:*"
          - "androidx.test*:*"
          - "org.mockito:*"
        update-types:
          - "minor"
          - "patch"
      android-gradle-runtime-libraries-patch-minor:
        patterns:
          - "org.jetbrains.kotlinx:*"
          - "com.airbnb.android:*"
          - "com.google.android.material:*"
          - "org.orbit-mvi:*"
        update-types:
          - "minor"
          - "patch"
      android-gradle-toolchain-held-patch-minor:
        patterns:
          - "com.android.application"
          - "com.android.library"
          - "org.jetbrains.kotlin.android"
          - "org.jetbrains.kotlin.plugin.compose"
          - "org.jetbrains.kotlin.plugin.serialization"
          - "org.jetbrains.kotlin.jvm"
          - "com.google.dagger.hilt.android"
          - "com.google.dagger:*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "com.google.dagger.hilt.android"
        # #925: Hilt 2.59+ requires AGP 9. Keep Stopit on the AGP 8.x
        # toolchain until a dedicated Android stack/toolchain lane upgrades AGP,
        # Gradle, Kotlin, KSP, Compose, and Hilt together.
        versions:
          - "[2.59,)"
      - dependency-name: "com.google.dagger:hilt-android"
        # Same AGP 9 boundary as the Hilt Gradle plugin above. Do not let the
        # broad android-gradle-patch-minor group recreate #914's known-incompatible
        # Hilt 2.59.x + AGP 8.x Gradle configuration failure.
        versions:
          - "[2.59,)"
      - dependency-name: "com.google.dagger:hilt-compiler"
        # Keep Hilt runtime/compiler/plugin aligned; release together from a
        # dedicated toolchain PR after AGP 9 readiness is explicit.
        versions:
          - "[2.59,)"
      - dependency-name: "org.jetbrains.kotlin.android"
        # #1009 removed legacy kotlinOptions.jvmTarget in app/core:kds and pins
        # JvmTarget.JVM_17 through compilerOptions. Still hold Kotlin 2.3+ out
        # of the broad group until a dedicated Kotlin/toolchain lane validates
        # KSP, Compose, serialization, Android CI, and Release Build together.
        versions:
          - "[2.3,)"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        # Keep Kotlin Android and Compose compiler plugin aligned; do not let the
        # broad android-gradle-patch-minor group auto-land the Kotlin 2.3 DSL break.
        versions:
          - "[2.3,)"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        # Serialization plugin follows the Kotlin toolchain lane and should not
        # outrun the post-#1009 Kotlin 2.3+ validation package.
        versions:
          - "[2.3,)"
      - dependency-name: "org.jetbrains.kotlin.jvm"
        # #939/#984/#1009: the standalone Kotlin JVM plugin shares the same
        # Kotlin 2.3+ validation boundary as Android/Compose/serialization.
        # Keep it out of the broad android-gradle-patch-minor group until the
        # dedicated Kotlin/toolchain lane proves the full toolchain together.
        versions:
          - "[2.3,)"
      - dependency-name: "androidx.core:core-ktx"
        # #1008 / PR #989: core-ktx 1.19.0 resolves androidx.core:core 1.19.0,
        # which requires compileSdk 37+ and AGP 9.1.0+. Stopit currently builds
        # app/core:kds at compileSdk 35 on AGP 8.x, so keep this out of the broad
        # weekly group until a dedicated Android toolchain lane raises both.
        versions:
          - "[1.19,)"
      - dependency-name: "androidx.navigation:navigation-compose"
        # #1008 / PR #989: navigation-compose 2.9.x pulls navigationevent 1.0.0,
        # whose published metadata requires compileSdk 36+. Treat this as an
        # AndroidX toolchain boundary, not an app-code regression.
        versions:
          - "[2.9,)"
      - dependency-name: "androidx.lifecycle:lifecycle-runtime-ktx"
        # #1008: lifecycle 2.11.x belongs with the same compileSdk/AGP validation
        # batch as core/navigation/activity/compose, not the weekly patch/minor group.
        versions:
          - "[2.11,)"
      - dependency-name: "androidx.lifecycle:lifecycle-process"
        # Keep lifecycle artifacts aligned until the Android toolchain lane can
        # validate the required compileSdk/AGP baseline together.
        versions:
          - "[2.11,)"
      - dependency-name: "androidx.lifecycle:lifecycle-runtime-compose"
        # Keep lifecycle artifacts aligned until the Android toolchain lane can
        # validate the required compileSdk/AGP baseline together.
        versions:
          - "[2.11,)"
      - dependency-name: "androidx.activity:activity-compose"
        # #1008: activity 1.13.x was part of PR #989's known-incompatible
        # AndroidX batch while Stopit is still compileSdk 35 / AGP 8.x.
        versions:
          - "[1.13,)"
      - dependency-name: "androidx.compose:compose-bom"
        # #1008: hold the Compose BOM generation that arrived with the same
        # compileSdk/AGP-bound AndroidX batch; move it through a toolchain lane.
        versions:
          - "[2025.12,)"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "r0adkll/upload-google-play"
        # Release-critical Play upload provenance boundary. Refresh only through
        # a reviewed release-governance PR that updates workflow, contract test,
        # and operator docs together.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      functions-npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "bun"
    directory: "/tools/aso-screenshots"
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: "Asia/Seoul"
    labels:
      - "maintenance"
      - "automation"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      aso-screenshots-bun-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
